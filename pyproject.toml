[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hexagon"
version = "0.3.2a2"
description = "Experimental CLI for managing Qubes OS VMs"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"
authors = [{ name = "Conor Schaefer", email = "conor@ruin.dev" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/conorsch/hexagon"

[tool.setuptools]
packages = ["hexagon"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unit tests run anywhere (incl. the Nix dev shell / CI); integration tests need
# a live Qubes Admin API and are skipped unless explicitly enabled. See
# tests/conftest.py and docs/testing.md.
markers = [
    "unit: pure-logic tests, no Qubes required",
    "integration: requires a live Qubes Admin API (dom0 or a management AppVM)",
    "packaging: inspects built artifacts (RPM, wheel, nix); needs the relevant tooling on PATH",
]
addopts = "-ra"

[project.scripts]
hexagon = "hexagon.cli:main"
qvm-reboot = "hexagon.cli:qvm_reboot_main"
